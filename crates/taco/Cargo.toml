[package]
name = "taco"
version = "0.1.0"
description = "Taco: the library. Tokenizer, HardShell, range coder and container together."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
hardshell = { path = "../hardshell" }
# ADR 0016: the GPU backends. Both build on every machine; they find the driver at run time.
hardshell-cuda = { path = "../hardshell-cuda" }
hardshell-gpu = { path = "../hardshell-gpu" }
taco-coder = { path = "../taco-coder" }
taco-format = { path = "../taco-format" }
taco-match = { path = "../taco-match" }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
