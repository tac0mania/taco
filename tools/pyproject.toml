[project]
name = "taco-tools"
version = "0.1.0"
description = "Taco tools that run before publication: float baselines and measurements."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.4",
    "regex>=2024.0",
    "zstandard>=0.22",
]

[project.optional-dependencies]
# Route A (tools/finetune/train.py): the fine-tune on a GPU machine. Not in the default
# environment. Install with `uv sync --extra train`. The data tools and the converter do not
# need it.
train = [
    "torch>=2.4",
    "transformers>=4.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseline"]
