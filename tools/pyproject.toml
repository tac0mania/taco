[project]
name = "taco-tools"
version = "0.1.0"
description = "Taco tools that run before publication: float baselines and measurements."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.4",
    "regex>=2024.0",
    "zstandard>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseline"]
