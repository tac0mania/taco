# Quality corpus for the phase 0 and phase 1 baseline (plan §11.2, §12).
# The files are not committed. `python -m baseline.fetch` downloads them to tools/data/corpus
# and checks the SHA-256 and the size (measured on 2026-10-18).
#
# `offset` is the first byte that the measurement uses. For Gutenberg files it is the byte after
# the "*** START OF THE PROJECT GUTENBERG EBOOK" line, so the English licence header is not
# measured. The measurement uses `cap` bytes from `offset` (or fewer, if the file is shorter).
#
# NOTE: corpus.canterbury.ac.nz refused the download (HTTP 403 from a Cloudflare bot check) on
# 2026-10-18. The Canterbury files come from a GitHub mirror. All 11 sizes agree with the
# published Canterbury sizes. alice29.txt, asyoulik.txt, lcet10.txt and plrabn12.txt also have
# the same SHA-256 as the copies in google/brotli tests/testdata (measured).
# NOTE: Project Gutenberg has no Hindi text in Devanagari that a search found (2026-10-18).
# Chinese is the third language.

cap = 32768

