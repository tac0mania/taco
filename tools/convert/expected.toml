# The expected SHA-256 of each model file that the exact converter makes (ADR 0014 point 5).
#
# One entry for each set of inputs: the model name, the weights (the SHA-256 of the float
# weights, or the seed of a generated model), the recipe and the SHA-256 of the statistics
# file. `convert.selfcheck` reads this file. The converter stops with an error when its output
# is not the expected file. Add an entry only after a deliberate change (`--new-hash`).

