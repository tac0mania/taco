# Calibration set for the GPT-2 conversion (plan §7.1, ADR 0004 section 7).
#
# None of these files is in the phase 0 quality corpus (tools/baseline/corpus.toml). The files
# are not committed. `python -m convert.calibrate --fetch` downloads them to tools/data/calib and
# checks the size and the SHA-256 (measured on 2026-10-18).
#
# For each source, the tool reads `cap` bytes from `offset`, tokenizes them with the GPT-2 BPE of
# tools/baseline, and takes the first `windows` windows of 1,024 tokens. The model input of a
# window is <|endoftext|> and then the first 1,023 tokens (plan §7.7), as in the evaluation.
# For Gutenberg files, `offset` is a byte after the "*** START OF" line.
#
# Licences: Project Gutenberg texts are in the public domain in the USA. listobject.c is under
# the PSF licence, strings.go under the BSD 3-clause licence. Taco uses them only as measurement
# data and does not distribute them.

[[source]]
