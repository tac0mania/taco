# Data for Route A: distilgpt2 fine-tuned on logs (research note 2026-10-19-route-a).
#
# The files are not committed. `python -m finetune.prepare` reads the archives from a local
# directory, checks the size and the SHA-256 (measured on 2026-10-18), and writes the splits.
#
# Licence (read on 2026-10-18):
# - The Zenodo record 10.5281/zenodo.8196385 ("Loghub: A Large Collection of System Log
#   Datasets for AI-driven Log Analytics") states the licence CC-BY-4.0.
# - The GitHub repository logpai/loghub states: "The datasets are freely available for research
#   or academic work." For use or distribution, refer to the repository URL and cite the Loghub
#   paper (Zhu et al., ISSRE 2023). GitHub reports the licence as "Other" (NOASSERTION).
# - The two statements are not the same. CC-BY-4.0 permits commercial use with attribution. The
#   README text names research use only. The owner must decide before a model that was
#   trained on Loghub ships in a product. Taco does not distribute the logs.
# - The logs are not anonymised (Loghub README). They can contain host names, user names and
#   IP addresses. Do not publish them or text that a model generates from them.

[licence]
zenodo = "CC-BY-4.0"
github = "freely available for research or academic work; cite the Loghub paper"
citation = "Zhu, He, He, Liu, Lyu. Loghub: A Large Collection of System Log Datasets for AI-driven Log Analytics. ISSRE 2023"

[split]
# Systems that the model never sees in training (all their data is evaluation data).
held_out = ["Apache", "HealthApp", "Proxifier", "Zookeeper"]
# For each training system: the first `cap` bytes of the large file (cut at a line end), then
# train = the first 90 %, val = the next 5 % (checkpoint selection), tail = the last 5 %
# (evaluation only). The 2k samples of the training systems can contain lines of the train part.
cap = 25165824
train_fraction = 0.90
val_fraction = 0.05

# The larger raw files (Zenodo). `range` = the first bytes of the archive only (an HTTP range
# request); the partial tar.gz gives a prefix of the log, which is sufficient for `cap`.
# `members`: the archive members, joined in this order. A pattern ("*.log") selects all the
# files that agree with it, in archive order.

[[archive]]
system = "Android"
url = "https://zenodo.org/api/records/8196385/files/Android_v1.zip/content"
name = "Android_v1.zip"
size = 24858007
sha256 = "0d04afa769e9eb59f9551151698127127e08c0c831b423c974024c78ce8c4d71"
members = ["Android.log"]

