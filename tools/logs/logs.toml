# Log corpus for the match-model measurement (ADR 0010, research note 2026-10-18-logs).
# The files are not committed. `python -m logs.fetch` downloads them to tools/data/logs and
# checks the size and the SHA-256 (measured on 2026-10-18).
#
# Loghub (logpai/loghub, master): the 2k samples, 2,000 lines of each system.
# Elastic examples (elastic/examples, master, Apache-2.0): two web access logs. They are larger
# than 1 MiB, so the measurement uses the first `cap` bytes, and a 1 MiB block exists.
# NOTE: the files come from `master` branches. If a branch changes, the hash check fails.
#
# `cap`: the number of bytes from the start of the file that the measurement uses. 0 = all.
# `group`: "loghub" (system logs), "access" (web access logs), "jsonl" (JSON lines).

